name: Backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clientflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clientflow -d clientflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ClientFlow.slnx --locked-mode
      - run: dotnet build ClientFlow.slnx -c Release --no-restore
      - name: Fast HTTP and token validation tests
        run: dotnet test ClientFlow.slnx -c Release --no-build --logger trx --results-directory artifacts/sqlite
      - name: PostgreSQL migrations and HTTP integration tests
        env:
          CLIENTFLOW_TEST_POSTGRES: Host=localhost;Port=5432;Database=clientflow;Username=clientflow;Password=ci-only-password
        run: dotnet test ClientFlow.slnx -c Release --no-build --logger trx --results-directory artifacts/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/**/*.trx
