name: clientflow

x-database-environment: &database-environment
  ConnectionStrings__ClientFlow: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-clientflow};Username=${POSTGRES_USER:-clientflow};Password="${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientflow}
      POSTGRES_USER: ${POSTGRES_USER:-clientflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/ClientFlow.Api/Dockerfile
      target: migrate
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/ClientFlow.Api/Dockerfile
      target: final
    environment:
      <<: *database-environment
      # Local HTTP stack; hosted deployments must configure HTTPS separately.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth0__Domain: ${AUTH0_DOMAIN:-}
      Auth0__Audience: ${AUTH0_AUDIENCE:-}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: final
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5-standalone
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
